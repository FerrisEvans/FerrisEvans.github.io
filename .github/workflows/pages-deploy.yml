name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:deps

      - name: Require published English and Chinese article pairs
        run: npm run check:translations

      - name: Check TypeScript and content schemas
        run: npm run check

      - name: Test runtime and content contracts
        run: npm test

      - name: Build site and search index
        run: npm run build

      - name: Verify build output
        run: npm run verify:build

      - name: Verify production reading and fallback paths
        env:
          # GitHub's Ubuntu runner already includes Chrome and its dependencies.
          BROWSER_CHANNEL: chrome
        run: |
          # Keep Astro in the foreground so this PID owns the HTTP server.
          node node_modules/astro/bin/astro.mjs preview --ignore-lock --host 127.0.0.1 --port 4327 > "$RUNNER_TEMP/preview.log" 2>&1 &
          preview_pid=$!
          cleanup_preview() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup_preview EXIT
          preview_ready=0
          for attempt in $(seq 1 40); do
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/preview.log"
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:4327/en/notes/ > /dev/null; then
              preview_ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$preview_ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/preview.log"
            exit 1
          fi
          npm run test:browser
          npm run test:i18n-browser
          npm run test:guides
          npm run test:authoring

      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          include-hidden-files: true

  deploy:
    permissions:
      pages: write
      id-token: write
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
